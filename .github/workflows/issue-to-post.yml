# .github/workflows/issue-to-post.yml

name: 🚀 Issue to Blog Post

on:
  issues:
    types:
      - opened
if: contains(github.event.issue.labels.*.name, 'new-post')

jobs:
  create-post-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 파일명에 사용할 날짜 형식(YYYY-MM-DD)을 생성하는 스텝 추가
      - name: Set Date Slug
        id: date
        run: echo "date_slug=${{ github.event.issue.created_at.substring(0, 10) }}" >> $GITHUB_OUTPUT

      - name: Create Post and Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: 새 포스트 추가 - ${{ github.event.issue.title }}" # <--- 변경됨 (이슈 제목 사용)
          committer: GitHub Actions <actions@github.com>
          author: ${{ github.event.issue.user.login }} <${{ github.event.issue.user.id }}+${{ github.event.issue.user.login }}@users.noreply.github.com>
          branch: "post/${{ github.event.issue.number }}"
          delete-branch: true

          # PR 제목을 이슈 제목으로 사용
          title: "✍️ 새 포스트: ${{ github.event.issue.title }}" # <--- 변경됨 (이슈 제목 사용)
          body: |
            '${{ github.event.issue.title }}' 포스트를 추가하는 PR입니다.
            
            이슈 원본: #${{ github.event.issue.number }}
            작성자: @${{ github.event.issue.user.login }}
            
            내용 확인 후 병합(merge)해주세요.
          labels: |
            blog-post
            autogenerated
          assignees: "${{ github.event.issue.user.login }}"

          # 파일 내용을 생성
          content: |
            ---
            title: "${{ github.event.issue.title }}" # <--- 변경됨 (이슈 제목 사용)
            date: "${{ github.event.issue.created_at }}" # 이슈 생성 시각(전체)을 사용
            ---

            ${{ fromJson(github.event.issue.body).body }}
          
          # 파일 경로 생성
          path: "_posts/${{ steps.date.outputs.date_slug }}-${{ replace(replace(toLower(github.event.issue.title), ' ', '-'), '.', '') }}.md" # <--- 변경됨 (이슈 제목 및 날짜 스텝 사용)