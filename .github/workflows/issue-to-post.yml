# .github/workflows/issue-to-post.yml

name: 🚀 Issue to Blog Post

on:
  issues:
    types:
      - opened # 이슈가 생성될 때만 실행

# 'new-post' 라벨이 있는 이슈에 대해서만 워크플로우를 실행합니다.
if: contains(github.event.issue.labels.*.name, 'new-post')

jobs:
  create-post-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # 브랜치 생성, 파일 커밋 권한
      issues: read          # 이슈 내용 읽기 권한
      pull-requests: write  # PR 생성 권한

    steps:
      # 1. 저장소 코드를 체크아웃합니다.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 이슈 데이터를 기반으로 마크다운 파일을 생성하고 PR을 만듭니다.
      - name: Create Post and Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          # GitHub Actions 실행을 위한 기본 토큰
          token: ${{ secrets.GITHUB_TOKEN }}

          # === 커밋 및 브랜치 정보 ===
          commit-message: "docs: 새 포스트 추가 - ${{ github.event.issue.title }}"
          committer: GitHub Actions <actions@github.com>
          author: ${{ github.event.issue.user.login }} <${{ github.event.issue.user.id }}+${{ github.event.issue.user.login }}@users.noreply.github.com>
          # 'post/이슈번호' 형식으로 새 브랜치를 생성합니다.
          branch: "post/${{ github.event.issue.number }}"
          delete-branch: true # PR이 병합되면 브랜치를 자동으로 삭제합니다.

          # === PR 정보 ===
          title: "✍️ 새 포스트: ${{ fromJson(github.event.issue.body).title }}"
          body: |
            '${{ fromJson(github.event.issue.body).title }}' 포스트를 추가하는 PR입니다.
            
            이슈 원본: #${{ github.event.issue.number }}
            작성자: @${{ github.event.issue.user.login }}
            
            내용 확인 후 병합(merge)해주세요.
          labels: |
            blog-post
            autogenerated
          assignees: "${{ github.event.issue.user.login }}" # PR 담당자를 이슈 작성자로 자동 지정

          # === 파일 생성 정보 ===
          # create-pull-request 액션은 base64 인코딩된 콘텐츠를 받아 파일을 생성할 수 있습니다.
          # fromJson() 함수를 사용해 이슈 본문(JSON 형식)에서 각 필드 값을 추출합니다.
          content: |
            ---
            title: "${{ fromJson(github.event.issue.body).title }}"
            date: "${{ github.event.issue.created_at }}"
            ---

            ${{ fromJson(github.event.issue.body).body }}
          
          # 'YYYY-MM-DD-제목.md' 형식의 파일 경로를 동적으로 생성합니다.
          # slug를 만들기 위해 제목의 공백을 '-'로, 특수문자를 제거합니다.
          path: "_posts/${{ fromJson(github.event.issue.created_at).slice(0, 10) }}-${{ replace(replace(toLower(fromJson(github.event.issue.body).title), ' ', '-'), '.', '') }}.md"