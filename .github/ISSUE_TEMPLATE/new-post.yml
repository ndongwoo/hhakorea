# .github/ISSUE_TEMPLATE/new-post.yml

name: 📝 새 블로그 포스트 작성
description: 이 템플릿을 사용하여 새 블로그 포스트를 작성합니다.
title: "[POST] "
labels: ["new-post"] # 이 이슈에 자동으로 'new-post' 라벨을 붙입니다.
body:
  - type: input
    id: title
    attributes:
      label: 글 제목 (Title)
      description: "포스트의 제목을 입력하세요."
      placeholder: "예: 1월 활동 소식"
    validations:
      required: true

  - type: textarea
    id: body
    attributes:
      label: 본문 (Content)
      description: "포스트의 전체 내용을 마크다운 형식으로 작성하세요. 이미지는 마우스로 끌어다 놓거나(drag & drop) 붙여넣기하면 자동으로 업로드됩니다."
      placeholder: |
        여기에 글의 본문을 작성합니다.
        
        ## 소제목
        
        - 목록 1
        - 목록 2
        
        이미지를 추가하려면 여기에 끌어다 놓으세요.
    validations:
      required: true