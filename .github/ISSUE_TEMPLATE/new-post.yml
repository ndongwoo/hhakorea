# .github/ISSUE_TEMPLATE/new-post.yml

name: 📝 새 블로그 포스트 작성
description: 이 템플릿을 사용하여 새 블로그 포스트를 작성합니다.
# 'title: "[POST] "' 줄을 삭제했습니다.
# 'labels'는 유지합니다.
labels: ["new-post"]
body:
  # 'id: title' (글 제목) 필드 블록을 여기서 완전히 삭제했습니다.

  - type: textarea
    id: body
    attributes:
      label: 본문 (Content)
      description: "포스트의 전체 내용을 마크다운 형식으로 작성하세요. 이미지는 마우스로 끌어다 놓거나(drag & drop) 붙여넣기하면 자동으로 업로드됩니다."
      placeholder: |
        여기에 글의 본문을 작성합니다.
        
        ## 소제목
        
        - 목록 1
        - 목록 2
        
        이미지를 추가하려면 여기에 끌어다 놓으세요.
    validations:
      required: true      